[package]
name = "symproject"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Nathaniel T. Berry"]
license = "Apache-2.0"
description = "Scaffold a research-project repository: paper line, shared library, and results"
repository = "https://github.com/symworx/symproject"
readme = "README.md"

[[bin]]
name = "symproject"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2.0"
include_dir = "0.7"

[dev-dependencies]
tempfile = "3.14"
