#
# Source of truth for shapes, runtimes, the default lab org, and the paper stub.
# Copy templates/lab.yml for a real lab. Do not hardcode those ids in the scaffolder (src/).

version: 1

kit:
  name: symproject
  description: Scaffold a research project (paper line, shared library, results)

defaults:
  shape: paper-line
  runtime: uv
  org: lab

shapes:
  paper-line:
    description: Papers, shared src, scripts, data pointers, gitignored results
    vars:
      LAB_LINE: ""
      ISSUE_LINE: "Track each paper in whatever tracker you already use."
      RUNTIME_NOTE: ""
    dirs:
      - data/samples
      - papers
      - results
      - scripts
      - src/__PACKAGE__
      - tests
    keep:
      - data/samples/.gitkeep
    files:
      - src: shapes/paper-line/README.md.tpl
        dest: README.md
      - src: shapes/paper-line/CONTRIBUTING.md.tpl
        dest: CONTRIBUTING.md
      - src: shapes/paper-line/AGENTS.md.tpl
        dest: AGENTS.md
      - src: shapes/paper-line/gitignore.tpl
        dest: .gitignore
      - src: shapes/paper-line/data/README.md.tpl
        dest: data/README.md
      - src: shapes/paper-line/papers/README.md.tpl
        dest: papers/README.md
      - src: shapes/paper-line/results/README.md.tpl
        dest: results/README.md
      - src: shapes/paper-line/scripts/README.md.tpl
        dest: scripts/README.md
      - src: shapes/paper-line/tests/README.md.tpl
        dest: tests/README.md
      - src: shapes/paper-line/src/README.md.tpl
        dest: src/__PACKAGE__/README.md
      - src: shapes/paper-line/src/__init__.py.tpl
        dest: src/__PACKAGE__/__init__.py

runtimes:
  none:
    description: No language runtime (no pyproject.toml)
  uv:
    description: Python via uv (src layout, pytest extra, uv.lock when uv is on PATH)
    vars:
      RUNTIME_NOTE: |
        ## Run

        ```bash
        uv sync --extra dev
        uv run pytest
        ```
    files:
      - src: runtimes/uv/pyproject.toml.tpl
        dest: pyproject.toml
    gitignore_append: runtimes/uv/gitignore.fragment

orgs:
  none:
    description: Lab-neutral paper line
  lab:
    description: "Default lab overlay. Replace with `symproject set-lab`."
    vars:
      GITHUB_ORG: lab-org
      LAB_URL: https://lab.example
      LAB_NAME: Lab name
      LAB_LINE: "Lab: [Lab name](https://lab.example)."
      ISSUE_LINE: "Track each paper in whatever tracker you already use."

paper:
  description: One working paper under papers/<slug>/
  dirs:
    - papers/__SLUG__
    - papers/__SLUG__/notes
    - papers/__SLUG__/analysis
    - results/__SLUG__
  keep:
    - results/__SLUG__/.gitkeep
  files:
    - src: paper/README.md.tpl
      dest: papers/__SLUG__/README.md
    - src: paper/manuscript.md.tpl
      dest: papers/__SLUG__/manuscript.md
    - src: paper/notes/claims.md.tpl
      dest: papers/__SLUG__/notes/claims.md
    - src: paper/notes/pipeline.md.tpl
      dest: papers/__SLUG__/notes/pipeline.md
    - src: paper/analysis/README.md.tpl
      dest: papers/__SLUG__/analysis/README.md
